---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-token-secret
  namespace: caddy
type: Opaque
stringData:
  # Long-lived token for the kubernetes-dashboard `admin-user` ServiceAccount.
  # Caddy injects it as `Authorization: Bearer` so the dashboard skips its own
  # login screen; Authelia forward_auth is the real auth gate.
  #
  # Generate and apply the real value (never commit the token):
  #   kubectl -n kubernetes-dashboard create token admin-user --duration=8760h
  DASHBOARD_TOKEN: "REPLACE_ME"
