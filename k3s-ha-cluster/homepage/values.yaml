            widget:
              type: speedtest
              url: http://speedtest-tracker.speedtest-tracker.svc.cluster.local
        - Beszel:
            href: https://beszel.yukselcloud.com
            icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/beszel.png
