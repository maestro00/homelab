apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://guerzon.github.io/vaultwarden
      chart: vaultwarden
      targetRevision: "0.44.0"
      helm:
        valueFiles:
          - $values/k3s-ha-cluster/vaultwarden/values.yaml
    - repoURL: https://git.yukselcloud.com/lab/homelab.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
