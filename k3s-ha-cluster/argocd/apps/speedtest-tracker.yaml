apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: speedtest-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.yukselcloud.com/lab/homelab.git
    targetRevision: master
    path: k3s-ha-cluster/speedtest-tracker
  destination:
    server: https://kubernetes.default.svc
    namespace: speedtest-tracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
