apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lldap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.yukselcloud.com/lab/homelab.git
    targetRevision: master
    path: k3s-ha-cluster/auth/lldap
    helm:
      releaseName: lldap
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: auth
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
