apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  server.yml: |
    base-url: {{ .Values.config.baseURL }}
    cache-file: /var/cache/ntfy/cache.db
    auth-file: /var/lib/ntfy/auth.db
    auth-default-access: {{ .Values.config.authDefaultAccess }}
    behind-proxy: {{ .Values.config.behindProxy }}
    log-level: {{ .Values.config.logLevel }}
    enable-login: {{ .Values.config.enableLogin }}
    require-login: true
    upstream-base-url: {{ .Values.config.upstreamBaseURL }}
    # Attachments (e.g. changedetection.io diff .txt) need an explicit cache dir.
    attachment-cache-dir: /var/cache/ntfy/attachments
    attachment-total-size-limit: 512M
    attachment-file-size-limit: 10M
    attachment-expiry-duration: 6h
