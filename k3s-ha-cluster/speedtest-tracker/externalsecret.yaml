---
# Declares the DB secret; values live in the `gitops-secrets` source Secret
# (external-secrets namespace). ESO reconciles this into speedtest-db-secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: speedtest-db-secret
  namespace: speedtest-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops
    kind: ClusterSecretStore
  target:
    name: speedtest-db-secret
  data:
    - secretKey: app-key
      remoteRef:
        key: gitops-secrets
        property: speedtest-app-key
    - secretKey: password
      remoteRef:
        key: gitops-secrets
        property: speedtest-db-password
