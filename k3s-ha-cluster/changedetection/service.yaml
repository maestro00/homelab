apiVersion: v1
kind: Service
metadata:
  name: changedetection
  namespace: changedetection
  labels:
    app: changedetection
spec:
  type: ClusterIP
  selector:
    app: changedetection
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: sockpuppetbrowser
  namespace: changedetection
  labels:
    app: sockpuppetbrowser
spec:
  type: ClusterIP
  selector:
    app: sockpuppetbrowser
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
