---
# Declares homepage's widget API keys; values live in the `gitops-secrets`
# source Secret. Helm-source Applications do not apply arbitrary YAML from
# their `path`, so ExternalSecrets for Helm apps live here and are applied by
# the ESO workflow (deploy-external-secrets.yml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops
    kind: ClusterSecretStore
  target:
    name: homepage-secrets
  data:
    - secretKey: HOMEPAGE_VAR_SONARR_API_KEY
      remoteRef:
        key: gitops-secrets
        property: homepage-sonarr-api-key
    - secretKey: HOMEPAGE_VAR_RADARR_API_KEY
      remoteRef:
        key: gitops-secrets
        property: homepage-radarr-api-key
    - secretKey: HOMEPAGE_VAR_PROWLLARR_API_KEY
      remoteRef:
        key: gitops-secrets
        property: homepage-prowlarr-api-key
    - secretKey: HOMEPAGE_VAR_BAZARR_API_KEY
      remoteRef:
        key: gitops-secrets
        property: homepage-bazarr-api-key
    - secretKey: HOMEPAGE_VAR_NTFY_TOKEN
      remoteRef:
        key: gitops-secrets
        property: homepage-ntfy-token
    - secretKey: HOMEPAGE_VAR_JELLYFIN_API_KEY
      remoteRef:
        key: gitops-secrets
        property: homepage-jellyfin-api-key
    - secretKey: HOMEPAGE_VAR_SEERR_API_KEY
      remoteRef:
        key: gitops-secrets
        property: homepage-seerr-api-key
    - secretKey: HOMEPAGE_VAR_QBITTORRENT_PASSWORD
      remoteRef:
        key: gitops-secrets
        property: homepage-qbittorrent-password
    - secretKey: HOMEPAGE_VAR_ADGUARD_USERNAME
      remoteRef:
        key: gitops-secrets
        property: homepage-adguard-username
    - secretKey: HOMEPAGE_VAR_ADGUARD_PASSWORD
      remoteRef:
        key: gitops-secrets
        property: homepage-adguard-password
