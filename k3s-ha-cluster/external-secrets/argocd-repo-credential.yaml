---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops
    kind: ClusterSecretStore
  target:
    name: argocd-repo
    template:
      metadata:
        labels:
          # Argo CD auto-registers Secrets with this label as repos.
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://git.yukselcloud.com/lab/homelab.git
        username: lab
        password: "{{ .forgejo_read_token }}"
  data:
    - secretKey: forgejo_read_token
      remoteRef:
        key: gitops-secrets
        property: forgejo-read-token
