---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-store
  namespace: external-secrets

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-store-read
  namespace: external-secrets
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-store-read
  namespace: external-secrets
subjects:
  - kind: ServiceAccount
    name: gitops-store
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitops-store-read
