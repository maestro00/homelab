---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops
    kind: ClusterSecretStore
  target:
    name: authelia-secrets
  data:
    - secretKey: identity_validation.reset_password.jwt.hmac.key
      remoteRef:
        key: gitops-secrets
        property: authelia-reset-password-jwt-hmac-key
    - secretKey: session.encryption.key
      remoteRef:
        key: gitops-secrets
        property: authelia-session-encryption-key
    - secretKey: storage.encryption.key
      remoteRef:
        key: gitops-secrets
        property: authelia-storage-encryption-key
    - secretKey: session.redis.password.txt
      remoteRef:
        key: gitops-secrets
        property: redis-password
    - secretKey: authentication.ldap.password.txt
      remoteRef:
        key: gitops-secrets
        property: authelia-ldap-password
    - secretKey: identity_providers.oidc.hmac.key
      remoteRef:
        key: gitops-secrets
        property: authelia-oidc-hmac-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-clients
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops
    kind: ClusterSecretStore
  target:
    name: oidc-clients
  data:
    - secretKey: forgejo
      remoteRef:
        key: gitops-secrets
        property: authelia-oidc-forgejo-client-secret-hash
    - secretKey: jellyfin
      remoteRef:
        key: gitops-secrets
        property: authelia-oidc-jellyfin-client-secret-hash
    - secretKey: vaultwarden
      remoteRef:
        key: gitops-secrets
        property: authelia-oidc-vaultwarden-client-secret-hash
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwk-rsa
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops
    kind: ClusterSecretStore
  target:
    name: jwk-rsa
  data:
    - secretKey: private.pem
      remoteRef:
        key: gitops-secrets
        property: authelia-jwk-rsa-private-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-credentials
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops
    kind: ClusterSecretStore
  target:
    name: lldap-credentials
    template:
      metadata:
        annotations:
          helm.sh/resource-policy: keep
  data:
    - secretKey: lldap-jwt-secret
      remoteRef:
        key: gitops-secrets
        property: lldap-jwt-secret
    - secretKey: lldap-ldap-user-name
      remoteRef:
        key: gitops-secrets
        property: lldap-admin-username
    - secretKey: lldap-ldap-user-pass
      remoteRef:
        key: gitops-secrets
        property: lldap-admin-password
    - secretKey: base-dn
      remoteRef:
        key: gitops-secrets
        property: lldap-base-dn
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gitops
    kind: ClusterSecretStore
  target:
    name: redis-secret
  data:
    - secretKey: redis-password
      remoteRef:
        key: gitops-secrets
        property: redis-password
