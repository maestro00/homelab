---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gitops
spec:
  provider:
    kubernetes:
      # Source Secret `gitops-secrets` lives in the external-secrets namespace.
      remoteNamespace: external-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: gitops-store
          namespace: external-secrets
