image:
  repository: vaultwarden/server
  tag: 1.37.0-alpine
  pullPolicy: IfNotPresent
  extraVars:
    - key: PASSWORD_HINTS_ALLOWED
      value: "false"

domain: "https://vaultwarden.yukselcloud.com"

adminToken:
  existingSecret: vaultwarden-secrets
  existingSecretKey: ADMIN_TOKEN

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.0.204"

storage:
  data:
    name: "vaultwarden-data"
    size: "1Gi"
    class: "longhorn"
    path: "/data"
    keepPvc: true
    accessMode: "ReadWriteOnce"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false

signupsAllowed: false
invitationsAllowed: false
showPassHint: "false"

sso:
  enabled: true
  existingSecret: vaultwarden-secrets
  onlySSO: false
  signupsMatchEmail: true
  ignoreEmailVerification: false
  authority: "https://auth.yukselcloud.com"
  scopes: "openid email profile offline_access"
  pkce: true
  masterPasswordPolicy: ""
  clientId:
    existingSecretKey: SSO_CLIENT_ID
  clientSecret:
    existingSecretKey: SSO_CLIENT_SECRET

extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: vaultwarden-secrets
      namespace: vaultwarden
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      refreshInterval: 1h
      secretStoreRef:
        name: gitops
        kind: ClusterSecretStore
      target:
        name: vaultwarden-secrets
      data:
        - secretKey: ADMIN_TOKEN
          remoteRef:
            key: gitops-secrets
            property: vaultwarden-admin-token
        - secretKey: SSO_CLIENT_ID
          remoteRef:
            key: gitops-secrets
            property: vaultwarden-sso-client-id
        - secretKey: SSO_CLIENT_SECRET
          remoteRef:
            key: gitops-secrets
            property: vaultwarden-sso-client-secret
