apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yusuf Taylan Yuksel, DevOps engineer in Helsinki</title>
    <meta name="description" content="Software developer and DevOps engineer at Ericsson, Helsinki. Home cloud on K3s: this page is served by it.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap" rel="stylesheet">
    <style>
    /* ── Tokens (direction sheet 1418059130: The contact sheet: charcoal and sage / Archivo) ── */
    :root {
      --bg: #1c1c1c;
      --surface: #262626;
      --ink: #f1f1ef;
      --muted: #a9aaa5;
      --accent: #8fa68e;
      --accent-ink: #1c1c1c;
      --field-1: #c8c5ba;
      --field-1-ink: #1c1c1c;
      --step-small: 1rem;
      --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
      --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
      --step-display: clamp(2.5rem, 7vw, 6.5rem);
      --font: 'Archivo', system-ui, sans-serif;
      --pad-page: clamp(20px, 4vw, 48px);
      --gap-strip: 10px;
      --ease: cubic-bezier(0.2, 0.6, 0.3, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    body {
      font-family: var(--font);
      font-weight: 400;
      background: var(--bg);
      color: var(--ink);
      font-size: var(--step-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--ink); text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    img { display: block; max-width: 100%; height: auto; }
    h1, h2, h3 { text-wrap: balance; font-weight: 400; }
    p { text-wrap: pretty; }

    /* ── First screen ── */
    .first-screen {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(24px, 4vh, 48px);
      padding: clamp(20px, 3vh, 40px) var(--pad-page) clamp(28px, 4vh, 44px);
    }
    .first-screen > * { min-width: 0; }
    .name-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 28px; }
    h1 {
      font-size: var(--step-display);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    .what {
      font-size: var(--step-lead);
      color: var(--muted);
      line-height: 1.1;
    }
    .corner-blocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, max-content));
      gap: 8px clamp(24px, 4vw, 56px);
      font-size: var(--step-small);
      margin-top: clamp(12px, 2vh, 20px);
    }
    .corner-blocks .label { color: var(--muted); display: block; margin-bottom: 2px; }
    .corner-blocks a { text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
    .corner-blocks nav { display: flex; flex-wrap: wrap; gap: 16px; font-size: var(--step-small); justify-self: end; justify-content: end; }

    /* ── The sheet: lit strip (signature drag row) ── */
    .strip-wrap { display: flex; flex-direction: column; justify-content: center; gap: 12px; min-height: 0; margin-inline: calc(-1 * var(--pad-page) + 20px); }
    .strip { padding-left: 20px; }
    .strip {
      display: flex;
      gap: var(--gap-strip);
      overflow-x: auto;
      scroll-snap-type: x proximity;
      height: clamp(220px, 34vh, 360px);
      scrollbar-width: thin;
      scrollbar-color: var(--surface) transparent;
    }
    .strip figure {
      flex: 0 0 auto;
      scroll-snap-align: center;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      filter: brightness(0.85);
      transition: filter 0.5s var(--ease);
    }
    .strip figure.lit, .strip figure:hover, .strip figure:focus-within { filter: brightness(1); }
    .strip figcaption {
      height: 30px;
      font-size: var(--step-body);
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .strip figcaption strong { color: var(--ink); font-weight: 600; }
    .strip figure img { height: calc(100% - 42px); width: auto; object-fit: cover; }
    .strip figure > .tile { height: calc(100% - 42px); }
    .tile {
      aspect-ratio: 3 / 2;
      background: var(--surface);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 16px;
      font-size: var(--step-body);
    }
    .tile > span:first-child { font-weight: 600; }
    a.tile:hover, a.tile:focus-visible { background: var(--field-1); color: var(--field-1-ink); }
    .tile .names { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: var(--step-small); }
    a.tile:hover .names, a.tile:focus-visible .names { color: var(--field-1-ink); }

    .hero-actions { display: flex; align-items: center; gap: clamp(16px, 3vw, 32px); flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 28px;
      background: var(--accent);
      color: var(--accent-ink);
      font: 600 var(--step-body)/1 var(--font);
      border: 0;
    }
    .btn:hover, .btn:focus-visible { background: var(--field-1); }
    .link-plain { font-size: var(--step-body); text-decoration: underline; text-underline-offset: 4px; }

    /* ── Shared section frame ── */
    main { padding: 0 var(--pad-page); }
    section { margin: clamp(96px, 15vh, 160px) 0; }
    h2 {
      font-size: var(--step-lead);
      line-height: 1.1;
      letter-spacing: -0.015em;
      margin-bottom: clamp(32px, 5vh, 56px);
    }

    /* ── About ── */
    .about-grid { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: clamp(24px, 4vw, 48px); }
    .facts { display: flex; flex-direction: column; gap: 20px; font-size: var(--step-small); }
    .facts .label { color: var(--muted); display: block; margin-bottom: 2px; }
    h2.mini { font-size: var(--step-small); font-weight: 600; color: var(--ink); margin-bottom: 20px; letter-spacing: 0; }
    .about-lead { font-size: var(--step-lead); line-height: 1.35; max-width: 56ch; }

    /* ── Proof: plain names in columns ── */
    .proof-grid { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: clamp(24px, 4vw, 48px); }
    .proof-grid > h2 { grid-column: 1 / 4; }
    .proof-names { grid-column: 5 / -1; display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 32px; }
    .proof-kind { break-inside: avoid; margin: 0 0 28px; font-size: var(--step-body); line-height: 1.5; }
    @media (max-width: 900px) { .proof-names { grid-template-columns: repeat(2, 1fr); } }
    .proof-kind .label { color: var(--muted); display: block; }

    /* ── Cluster: frame run with one lifted ── */
    .cluster-grid { display: grid; grid-template-columns: minmax(230px, 25%) 1fr; gap: 48px clamp(20px, 3vw, 48px); align-items: start; }
    .cluster-grid > h2 { grid-column: 1; margin-bottom: 24px; }
    .cluster-aside { grid-column: 1; display: flex; flex-direction: column; gap: 20px; font-size: var(--step-small); color: var(--ink); }
    .cluster-aside a { text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
    .frame-run { grid-column: 2; display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px 12px; align-items: end; }
    .frame-run > figure { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .f3 { grid-column: span 3; } .f5 { grid-column: span 5; } .f6 { grid-column: span 6; }
    .cap { display: flex; justify-content: space-between; gap: 12px; font-size: var(--step-body); color: var(--muted); }
    .cap strong { color: var(--ink); font-weight: 600; }

    /* interface fragments: their own conventions (inspector data-ui exemption) */
    [data-ui] { background: var(--surface); color: var(--ink); border: 1px solid rgba(241, 241, 239, 0.09); padding: 12px 0; font-size: var(--step-body); line-height: 1.45; overflow: hidden; height: 100%; }
    .ui-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; margin-bottom: 10px; padding-inline: 12px; }
    .ui-head .ui-sub { color: var(--muted); font-weight: 400; }
    table { width: 100%; border-collapse: collapse; font-size: inherit; }
    th, td { text-align: left; padding: 4px 12px; border-bottom: 1px solid rgba(241, 241, 239, 0.09); font-weight: 400; font-variant-numeric: tabular-nums; }
    th { color: var(--muted); }
    .ui-ok { color: var(--accent); }
    .ui-bar { display: inline-block; height: 6px; background: var(--accent); vertical-align: middle; }

    /* ── Work: book-spine shelf, on the one pale field ── */
    #work { background: var(--field-1); color: var(--field-1-ink); margin-inline: calc(-1 * var(--pad-page)); padding: clamp(96px, 14vh, 140px) var(--pad-page); }
    #work .shelf-note { color: var(--field-1-ink); }
    .work-row { display: flex; gap: clamp(24px, 4vw, 64px); align-items: flex-end; margin-top: 48px; }
    .shelf { display: flex; gap: 6px; align-items: flex-start; flex: 1; min-width: 0; }
    .legend { flex: none; width: 300px; display: flex; flex-direction: column; gap: 12px; font-size: var(--step-small); color: var(--field-1-ink); text-align: right; }
    .legend .disc { font-style: normal; }
    .shelf-head { display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap; }
    .shelf-note { font-size: var(--step-small); color: var(--muted); }
    .spine { writing-mode: vertical-rl; width: 34px; height: 340px; font-size: var(--step-body); color: var(--field-1-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 4px; }
    .spine .disc { margin-top: 12px; padding: 2px 6px; font-size: var(--step-small); }
    #work .d-be { background: var(--surface); color: var(--ink); }
    .d-infra { background: var(--accent); color: var(--accent-ink); }
    .d-be { background: var(--field-1); color: var(--field-1-ink); }
    .d-fe { background: var(--ink); color: var(--bg); }
    .d-re { background: var(--muted); color: var(--bg); }
    .spine:hover, .spine:focus-visible { text-decoration: underline; text-underline-offset: 4px; }

    /* ── Record: two-ended rows ── */
    .record-col { max-width: none; margin-left: 0; }
    .rec { display: grid; grid-template-columns: 38% 1fr max-content; column-gap: clamp(24px, 4vw, 64px); align-items: baseline; margin-bottom: 14px; min-height: 38px; }
    .rec .rec-what { font-size: var(--step-body); }
    .rec .when { grid-area: when; }
    .rec-group { color: var(--muted); margin: 40px 0 10px; font-size: var(--step-body); }
    .rec-group:first-of-type { margin-top: 0; }
    .rec .rec-fact { color: var(--muted); font-size: var(--step-small); }
    .rec .when { color: var(--muted); font-size: var(--step-small); font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ── Contact band ── */
    .contact-grid { display: grid; grid-template-columns: repeat(12, 1fr); align-items: start; column-gap: clamp(16px, 2vw, 32px); }
    .contact-stmt { grid-column: 1 / 6; font-size: var(--step-lead); line-height: 1.2; max-width: 24ch; }
    .contact-photo { grid-column: 7 / 13; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 640px; }
    .contact-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .contact-photo img:first-child { animation: none; }
    .contact-links { grid-column: 10 / 13; display: flex; flex-direction: column; gap: 10px; font-size: 1.125rem; }
    .contact-links a { display: block; text-decoration: underline; text-underline-offset: 4px; }
    .contact-where { color: var(--muted); font-size: var(--step-small); margin-top: 10px; }

    /* ── Footer ── */
    .foot-name { display: block; font-size: clamp(2.2rem, 6.5vw, 6rem); line-height: 1; letter-spacing: -0.02em; color: var(--ink); margin-bottom: clamp(40px, 6vh, 72px); }
    footer { padding: clamp(56px, 9vh, 96px) var(--pad-page) clamp(48px, 7vh, 64px); color: var(--muted); font-size: var(--step-small); }
    .foot-row { display: flex; justify-content: space-between; gap: clamp(24px, 5vw, 80px); flex-wrap: wrap; }
    footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

    @media (min-width: 641px) { #deploy-frame [data-ui] { min-height: 560px; } }

    /* ── Tablet collapse ── */
    @media (max-width: 900px) {
      .proof-grid > h2, .proof-names { grid-column: 1 / -1; }
      .cluster-grid { grid-template-columns: 1fr; }
      .frame-run { grid-column: 1; }
      .frame-run .f3 { grid-column: span 6; }
      .contact-stmt { grid-column: 1 / 8; }
      .contact-photo { grid-column: 1 / -1; max-width: 560px; margin-top: 24px; }
      .contact-links { grid-column: 1 / -1; margin-top: 24px; }
    }

    /* ── Phone ── */
    @media (max-width: 640px) {
      .first-screen { padding: 20px var(--pad-page) 24px; }
      .strip { height: 46vh; }
      .about-grid { grid-template-columns: 1fr; }
      .about-lead { font-size: 1.1875rem; }
      .proof-grid > h2, .proof-names { grid-column: 1 / -1; }
      .proof-names { grid-template-columns: repeat(2, 1fr); }
      .cluster-grid { grid-template-columns: 1fr; }
      .frame-run { grid-column: 1; }
      .frame-run { grid-template-columns: repeat(6, 1fr); }
      .f3 { grid-column: span 6; } .f5, .f6 { grid-column: span 6; }
      .shelf { flex-wrap: wrap; height: auto; gap: 10px 14px; }
      .spine { writing-mode: horizontal-tb; width: auto; height: auto; white-space: normal; padding-top: 0; display: flex; align-items: baseline; gap: 8px; }
      .spine .disc { margin-top: 0; }
      .record-col { margin-left: 0; max-width: none; }
      .rec { grid-template-columns: 1fr max-content; column-gap: 16px; }
      .rec .rec-fact { grid-column: 1 / -1; }
      .legend { width: auto; text-align: left; }
      .contact-grid { grid-template-columns: 1fr; }
      .contact-stmt, .contact-photo, .contact-links { grid-column: 1 / -1; }
      .contact-photo { max-width: 480px; }
      .contact-photo { max-width: 220px; }
      section { margin: clamp(72px, 12vh, 120px) 0; }
    }

    /* motion layer: entrances — transform-only, so no capture (or script failure) can ever hide content */
    .js .rise { transform: translateY(18px); }
    .js .rise.in { transform: none; transition: transform 0.55s var(--ease); }
    .frame-run figure [data-ui] { transition: background 0.3s var(--ease); }
    .frame-run figure:hover [data-ui], .frame-run figure:focus-within [data-ui] { background: #2b2b2a; }
    @media (prefers-reduced-motion: no-preference) {
      .contact-photo img { animation: drift 24s ease-in-out infinite alternate; transform-origin: 60% 40%; }
    }
    @keyframes drift { from { transform: scale(1); } to { transform: scale(1.06); } }
    .photo-box { display: block; overflow: hidden; }
    @media (prefers-reduced-motion: reduce) {
      .js .rise { opacity: 1; transform: none; }
      .strip figure { transition: none; }
    }
    </style>
    </head>
    <body>
    <script>document.documentElement.classList.add('js');</script>

    <header class="first-screen">
      <div>
        <div class="name-row">
          <h1>Yusuf Taylan Yuksel</h1>
          <p class="what">Software developer &amp; DevOps engineer in Helsinki.</p>
        </div>
        <div class="corner-blocks">
          <p><span class="label">What</span>Software developer &amp; DevOps engineer</p>
          <p><span class="label">Where</span>Ericsson, Helsinki. Since October 2022.</p>
          <p><span class="label">Reach</span><a href="mailto:ytaylanyuksel@gmail.com">ytaylanyuksel@gmail.com</a></p>
          <nav aria-label="Sections">
            <a href="#cluster">Cluster</a>
            <a href="#work">Work</a>
            <a href="#record">Record</a>
            <a href="#contact">Contact</a>
          </nav>
        </div>
      </div>

      <div class="strip-wrap">
        <div class="strip" id="strip" aria-label="The systems I run, frame by frame">
          <figure class="lit" data-caption="Helsinki's South Harbour railway quay, 1907">
            <img src="img/satamarata-1907.jpg" width="760" height="578" alt="Helsinki South Harbour railway quay in 1907, a steam locomotive crossing the causeway in front of the city">
            <figcaption><strong>Signe Brander, 1907</strong>, the harbour railway quay</figcaption>
          </figure>
          <figure>
            <a class="tile" href="#cluster" aria-label="The cluster section"><span>This page</span><span class="names"><span>push</span><span>apply</span><span>rollout</span><span>serving</span></span></a>
            <figcaption><strong>This page</strong>, served by the machines below it</figcaption>
          </figure>
          <figure data-caption="Nodes: three control planes, two workers">
            <div class="tile"><span>The cluster</span><span class="names"><span>k3s ×5 nodes</span><span>proxmox</span><span>longhorn</span><span>metallb</span><span>caddy</span></span></div>
            <figcaption><strong>The cluster</strong>, under every frame on this page</figcaption>
          </figure>
          <figure>
            <div class="tile"><span>Watching it</span><span class="names"><span>beszel</span><span>uptime-kuma</span><span>homepage</span><span>ntfy</span><span>speedtest</span></span></div>
            <figcaption><strong>Watching it</strong>, so I know the moment something breaks</figcaption>
          </figure>
          <figure data-caption="Authelia in front of everything private">
            <div class="tile"><span>Locked down</span><span class="names"><span>authelia</span><span>lldap</span><span>crowdsec</span><span>tailscale</span><span>vaultwarden</span></span></div>
            <figcaption><strong>Locked down</strong>, nothing private faces the internet bare</figcaption>
          </figure>
          <figure>
            <img src="img/lab-1910.jpg" width="380" height="274" alt="A hospital laboratory room in Helsinki around 1910: desk, microscope, lamp and glassware">
            <figcaption><strong>Lab, c. 1910</strong>, the instruments of the era</figcaption>
          </figure>
          <figure data-caption="Jellyfin, Sonarr, Radarr behind a wireguard egress">
            <div class="tile"><span>The media cloud</span><span class="names"><span>jellyfin</span><span>sonarr</span><span>radarr</span><span>qbittorrent</span><span>gluetun</span></span></div>
            <figcaption><strong>The media cloud</strong>, a library that answers to no subscription</figcaption>
          </figure>
          <figure>
            <img src="img/elaintarha-1900.jpg" width="380" height="264" alt="State railway Elaintarha stop near central Helsinki around 1900: tracks, signal hut, a worker watching a train">
            <figcaption><strong>Eläintarha stop, c. 1900</strong>, infrastructure in its first century</figcaption>
          </figure>
          <figure data-caption="OpenGym, Translator, Telegram agent, shipped end to end">
            <div class="tile"><span>Apps I shipped</span><span class="names"><span>opengym</span><span>translator</span><span>telegram-agent</span><span>bentopdf</span><span>termix</span></span></div>
            <figcaption><strong>Apps I shipped</strong>, from repo to a URL on my domain</figcaption>
          </figure>
          <figure>
            <img src="img/west-harbour-2019.jpg" width="380" height="253" alt="Helsinki Western Harbour ferry terminal in 2019, angular glass roof under a grey sky">
            <figcaption><strong>Western Harbour, 2019</strong>, the city's other side of the water</figcaption>
          </figure>
          <figure data-caption="The same quay I stand on today">
            <img src="img/south-harbour-2019.jpg" width="760" height="468" alt="The South Harbour waterfront today, ferry terminals and the Uspenski Cathedral">
            <figcaption><strong>South Harbour today</strong>, same water, 112 years apart</figcaption>
          </figure>
        </div>
      </div>

      <div class="hero-actions">
        <a class="btn" href="mailto:ytaylanyuksel@gmail.com">Email me</a>
        <a class="link-plain" href="#cluster">See the cluster</a>
      </div>
    </header>

    <main>
    <section id="about" aria-labelledby="about-t">
      <div class="about-grid">
        <div>
          <h2 class="mini" id="about-t">About</h2>
          <div class="facts">
            <p><span class="label">Based</span>Helsinki, Finland</p>
            <p><span class="label">Currently</span>Ericsson, since 2022</p>
            <p><span class="label">At home</span>One K3s cluster, 28 namespaces</p>
            <p><span class="label">Degrees</span>Three, in three countries</p>
          </div>
        </div>
        <p class="about-lead">I build the systems software runs on. At Ericsson I design CI/CD pipelines and manage Kubernetes clusters. At home I run a K3s cluster that hosts this page, my password manager, my media library and the apps I have shipped myself. Five countries, three degrees, one constant: I learn infrastructure by operating it, then breaking it.</p>
      </div>
    </section>

    <section id="stack" aria-labelledby="stack-t">
      <div class="proof-grid">
        <h2 id="stack-t">Tech stack</h2>
        <div class="proof-names">
          <div class="proof-kind"><span class="label">Infrastructure</span>
            <p>Kubernetes, K3s, Helm, Docker, Terraform, Ansible, Proxmox, MetalLB, Longhorn, Caddy</p>
          </div>
          <div class="proof-kind"><span class="label">Languages</span>
            <p>Go, C#, Python, Bash, Java, Groovy, JavaScript</p>
          </div>
          <div class="proof-kind"><span class="label">Data &amp; storage</span>
            <p>PostgreSQL, MySQL, MariaDB, MSSQL, SQLite, Redis</p>
          </div>
          <div class="proof-kind"><span class="label">Security &amp; GitOps</span>
            <p>Authelia, OpenLDAP, CrowdSec, Tailscale, Vaultwarden, Forgejo Actions, GitLab CI, GitHub Actions, Jenkins</p>
          </div>
        </div>
      </div>
    </section>

    <section id="cluster" aria-labelledby="cluster-t">
      <div class="cluster-grid">
        <h2 id="cluster-t">The cloud under my desk</h2>
        <aside class="cluster-aside">
          <p>Three control planes, two workers, designed for no single weak machine. VMs on Proxmox; Longhorn keeps every volume on three disks; Caddy terminates TLS with CrowdSec watching the door.</p>
          <a href="#deploy-frame">See the pipeline</a>
        </aside>
        <div class="frame-run">
          <figure class="f3">
            <div data-ui>
              <div class="ui-head">Nodes <span class="ui-sub">k3s HA</span></div>
              <table>
                <tr><th>Role</th><th>Count</th><th>Status</th></tr>
                <tr><td>control-plane</td><td>3</td><td class="ui-ok">Ready</td></tr>
