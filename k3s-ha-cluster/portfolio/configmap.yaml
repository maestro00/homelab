    \         <li>Developed smart card and payment solutions (EMV standard, C#, WCF)</li>\n
    \         <li>Maintained Windows services and ASP.NET systems</li>\n          <li>Worked
    with secure personalization tools and RSA encryption</li>\n        </ul>\n        <div
