    \       <span class=\"tag\">Python</span>\n        <span class=\"tag\">Bash</span>\n
    \       <span class=\"tag\">JavaScript</span>\n        <span class=\"tag\">Java</span>\n
    \       <span class=\"tag\">Groovy</span>\n      </div>\n    </div>\n\n    <div
    class=\"card animate-in\">\n      <div class=\"skill-icon\">\U0001F5C4️</div>\n
    \     <h4 class=\"skill-cat\">Databases</h4>\n      <div class=\"skill-tags\">\n
    \       <span class=\"tag tag-accent\">PostgreSQL</span>\n        <span class=\"tag\">MySQL</span>\n
    \       <span class=\"tag\">MSSQL</span>\n        <span class=\"tag\">SQLite</span>\n
    \       <span class=\"tag\">MariaDB</span>\n        <span class=\"tag\">Redis</span>\n
    \     </div>\n    </div>\n\n    <div class=\"card animate-in\">\n      <div class=\"skill-icon\">\U0001F427</div>\n
    \     <h4 class=\"skill-cat\">Systems &amp; Networking</h4>\n      <div class=\"skill-tags\">\n
    \       <span class=\"tag tag-accent\">Linux</span>\n        <span class=\"tag\">Ubuntu</span>\n
