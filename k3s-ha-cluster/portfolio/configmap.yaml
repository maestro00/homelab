data:
  index.html: "<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"dark\">\n<head>\n  <meta
    charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width,
    initial-scale=1.0\" />\n  <title>Yusuf Taylan Yuksel — Software Developer &amp;
    DevOps</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"
    />\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap\"
    rel=\"stylesheet\" />\n  <style>\n    /* ── Design Tokens ─────────────────────────────────────────
    */\n    :root {\n      --bg:           #0a0f1e;\n      --bg-surface:   #111827;\n
    \     --bg-card:      rgba(17,24,39,0.8);\n      --border:       rgba(99,118,160,0.18);\n
    \     --text:         #e2e8f0;\n      --text-muted:   #94a3b8;\n      --accent:
    \      #06b6d4;\n      --accent-glow:  rgba(6,182,212,0.18);\n      --accent2:
    \     #6366f1;\n      --accent2-glow: rgba(99,102,241,0.15);\n      --success:
    \     #10b981;\n      --radius:       12px;\n      --radius-sm:    8px;\n      --transition:
    \  0.25s ease;\n      --font:         'Inter', system-ui, sans-serif;\n      --font-mono:
    \   'JetBrains Mono', monospace;\n      --shadow:       0 4px 24px rgba(0,0,0,0.4);\n
    \     --shadow-card:  0 2px 12px rgba(0,0,0,0.3);\n    }\n\n    [data-theme=\"light\"]
    {\n      --bg:           #f1f5f9;\n      --bg-surface:   #ffffff;\n      --bg-card:
    \     rgba(255,255,255,0.9);\n      --border:       rgba(100,116,139,0.2);\n      --text:
    \        #1e293b;\n      --text-muted:   #64748b;\n      --accent:       #0891b2;\n
    \     --accent-glow:  rgba(8,145,178,0.12);\n      --accent2:      #4f46e5;\n
    \     --accent2-glow: rgba(79,70,229,0.1);\n      --shadow:       0 4px 24px rgba(0,0,0,0.08);\n
    \     --shadow-card:  0 2px 12px rgba(0,0,0,0.06);\n    }\n\n    /* ── Reset ─────────────────────────────────────────────────
    */\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0;
    }\n    html { scroll-behavior: smooth; }\n    body {\n      font-family: var(--font);\n
    \     background: var(--bg);\n      color: var(--text);\n      line-height: 1.6;\n
    \     transition: background var(--transition), color var(--transition);\n      min-height:
    100vh;\n    }\n    a { color: var(--accent); text-decoration: none; transition:
    opacity var(--transition); }\n    a:hover { opacity: 0.8; }\n    ul { list-style:
    none; }\n\n    /* ── Background mesh ─────────────────────────────────────── */\n
    \   body::before {\n      content: '';\n      position: fixed;\n      inset: 0;\n
    \     background:\n        radial-gradient(ellipse 80% 50% at 20% 10%, var(--accent-glow),
    transparent),\n        radial-gradient(ellipse 60% 60% at 80% 80%, var(--accent2-glow),
    transparent);\n      pointer-events: none;\n      z-index: 0;\n    }\n\n    /*
    ── Nav ─────────────────────────────────────────────────── */\n    nav {\n      position:
    fixed;\n      top: 0; left: 0; right: 0;\n      z-index: 100;\n      background:
    rgba(10,15,30,0.8);\n      backdrop-filter: blur(16px);\n      -webkit-backdrop-filter:
    blur(16px);\n      border-bottom: 1px solid var(--border);\n      height: 60px;\n
    \     display: flex;\n      align-items: center;\n      justify-content: space-between;\n
    \     padding: 0 clamp(16px, 5vw, 64px);\n      transition: background var(--transition);\n
    \   }\n    [data-theme=\"light\"] nav { background: rgba(241,245,249,0.85); }\n\n
    \   .nav-logo {\n      font-family: var(--font-mono);\n      font-size: 14px;\n
    \     color: var(--accent);\n      font-weight: 500;\n      letter-spacing: 0.02em;\n
    \   }\n    .nav-logo span { color: var(--text-muted); }\n\n    .nav-links {\n
    \     display: flex;\n      gap: 28px;\n      align-items: center;\n    }\n    .nav-links
    a {\n      font-size: 13px;\n      font-weight: 500;\n      color: var(--text-muted);\n
    \     letter-spacing: 0.03em;\n      text-transform: uppercase;\n    }\n    .nav-links
    a:hover { color: var(--accent); opacity: 1; }\n\n    .theme-btn {\n      background:
    none;\n      border: 1px solid var(--border);\n      color: var(--text-muted);\n
    \     cursor: pointer;\n      padding: 6px 10px;\n      border-radius: var(--radius-sm);\n
    \     font-size: 14px;\n      transition: all var(--transition);\n      display:
    flex;\n      align-items: center;\n      gap: 6px;\n    }\n    .theme-btn:hover
    { border-color: var(--accent); color: var(--accent); }\n\n    /* ── Layout ────────────────────────────────────────────────
    */\n    main {\n      position: relative;\n      z-index: 1;\n      max-width:
    900px;\n      margin: 0 auto;\n      padding: 80px clamp(16px, 5vw, 32px) 80px;\n
    \   }\n\n    section { margin-bottom: 80px; }\n\n    .section-label {\n      font-family:
    var(--font-mono);\n      font-size: 12px;\n      font-weight: 500;\n      color:
    var(--accent);\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n
    \     margin-bottom: 12px;\n    }\n    .section-title {\n      font-size: clamp(22px,
    3.5vw, 30px);\n      font-weight: 700;\n      color: var(--text);\n      margin-bottom:
    8px;\n    }\n    .section-divider {\n      width: 40px;\n      height: 3px;\n
    \     background: linear-gradient(90deg, var(--accent), var(--accent2));\n      border-radius:
    2px;\n      margin-bottom: 32px;\n    }\n\n    /* ── Card ──────────────────────────────────────────────────
    */\n    .card {\n      background: var(--bg-card);\n      border: 1px solid var(--border);\n
    \     border-radius: var(--radius);\n      padding: 24px;\n      backdrop-filter:
    blur(12px);\n      -webkit-backdrop-filter: blur(12px);\n      box-shadow: var(--shadow-card);\n
    \     transition: border-color var(--transition), box-shadow var(--transition);\n
    \   }\n    .card:hover {\n      border-color: rgba(6,182,212,0.35);\n      box-shadow:
    0 4px 24px rgba(6,182,212,0.08);\n    }\n\n    /* ── Hero ──────────────────────────────────────────────────
    */\n    #hero {\n      min-height: calc(100vh - 60px);\n      display: flex;\n
    \     flex-direction: column;\n      justify-content: center;\n      padding-top:
    40px;\n      margin-bottom: 40px;\n    }\n\n    .hero-tag {\n      font-family:
    var(--font-mono);\n      font-size: 13px;\n      color: var(--accent);\n      margin-bottom:
    20px;\n      opacity: 0;\n      animation: fadeUp 0.6s ease 0.1s forwards;\n    }\n\n
    \   .hero-name {\n      font-size: clamp(36px, 7vw, 72px);\n      font-weight:
    700;\n      line-height: 1.05;\n      letter-spacing: -0.02em;\n      margin-bottom:
    16px;\n      opacity: 0;\n      animation: fadeUp 0.6s ease 0.2s forwards;\n    }\n
    \   .hero-name .accent { color: var(--accent); }\n\n    .hero-role {\n      font-size:
    clamp(16px, 2.5vw, 22px);\n      color: var(--text-muted);\n      font-weight:
    400;\n      margin-bottom: 24px;\n      opacity: 0;\n      animation: fadeUp 0.6s
    ease 0.3s forwards;\n    }\n    .hero-role strong { color: var(--text); font-weight:
    600; }\n\n    .hero-desc {\n      max-width: 600px;\n      font-size: 16px;\n
    \     color: var(--text-muted);\n      line-height: 1.7;\n      margin-bottom:
    40px;\n      opacity: 0;\n      animation: fadeUp 0.6s ease 0.4s forwards;\n    }\n\n
    \   .hero-actions {\n      display: flex;\n      gap: 16px;\n      flex-wrap:
    wrap;\n      opacity: 0;\n      animation: fadeUp 0.6s ease 0.5s forwards;\n    }\n\n
    \   .btn {\n      display: inline-flex;\n      align-items: center;\n      gap:
    8px;\n      padding: 12px 24px;\n      border-radius: var(--radius-sm);\n      font-size:
    14px;\n      font-weight: 600;\n      cursor: pointer;\n      transition: all
    var(--transition);\n      border: none;\n    }\n    .btn-primary {\n      background:
    var(--accent);\n      color: #0a0f1e;\n    }\n    .btn-primary:hover { opacity:
    0.88; transform: translateY(-1px); color: #0a0f1e; }\n    .btn-outline {\n      background:
    transparent;\n      color: var(--text);\n      border: 1px solid var(--border);\n
    \   }\n    .btn-outline:hover { border-color: var(--accent); color: var(--accent);
    opacity: 1; transform: translateY(-1px); }\n\n    .hero-stats {\n      display:
    flex;\n      gap: 40px;\n      margin-top: 60px;\n      opacity: 0;\n      animation:
    fadeUp 0.6s ease 0.65s forwards;\n    }\n    .stat-num {\n      font-size: 28px;\n
    \     font-weight: 700;\n      color: var(--accent);\n      font-family: var(--font-mono);\n
    \     line-height: 1;\n    }\n    .stat-label {\n      font-size: 12px;\n      color:
    var(--text-muted);\n      text-transform: uppercase;\n      letter-spacing: 0.06em;\n
    \     margin-top: 4px;\n    }\n\n    /* ── Animations ────────────────────────────────────────────
    */\n    @keyframes fadeUp {\n      from { opacity: 0; transform: translateY(20px);
    }\n      to   { opacity: 1; transform: translateY(0); }\n    }\n    .animate-in
    {\n      opacity: 0;\n      transform: translateY(16px);\n      transition: opacity
    0.5s ease, transform 0.5s ease;\n    }\n    .animate-in.visible { opacity: 1;
    transform: translateY(0); }\n  </style>\n</head>\n<body>\n\n<!-- ── Nav ─────────────────────────────────────────────────────
    -->\n<nav>\n  <div class=\"nav-logo\"><span>~/</span>taylan</div>\n  <div class=\"nav-links\">\n
    \   <a href=\"#about\">About</a>\n    <a href=\"#experience\">Experience</a>\n
    \   <a href=\"#skills\">Skills</a>\n    <a href=\"#education\">Education</a>\n
    \   <a href=\"#contact\">Contact</a>\n    <button class=\"theme-btn\" onclick=\"toggleTheme()\"
    aria-label=\"Toggle theme\">\n      <span id=\"theme-icon\">☀️</span>\n    </button>\n
    \ </div>\n</nav>\n\n<!-- ── Hero ────────────────────────────────────────────────────
    -->\n<main>\n<section id=\"hero\">\n  <p class=\"hero-tag\">// hello world</p>\n
    \ <h1 class=\"hero-name\">Yusuf Taylan<br><span class=\"accent\">Yuksel</span></h1>\n
    \ <p class=\"hero-role\"><strong>Software Developer</strong> &amp; DevOps Engineer</p>\n
    \ <p class=\"hero-desc\">\n    Building reliable systems at the intersection of
    software and infrastructure.\n    Passionate about CI/CD automation, Kubernetes,
    and self-hosted everything.\n    Currently at <strong>Ericsson</strong>, Helsinki.\n
    \ </p>\n  <div class=\"hero-actions\">\n    <a href=\"#contact\" class=\"btn btn-primary\">Get
    in touch</a>\n    <a href=\"#experience\" class=\"btn btn-outline\">View experience</a>\n
    \ </div>\n  <div class=\"hero-stats\">\n    <div>\n      <div class=\"stat-num\">4+</div>\n
    \     <div class=\"stat-label\">Years experience</div>\n    </div>\n    <div>\n
    \     <div class=\"stat-num\">5</div>\n      <div class=\"stat-label\">Countries
    lived in</div>\n    </div>\n    <div>\n      <div class=\"stat-num\">K3s</div>\n
    \     <div class=\"stat-label\">Home cluster</div>\n    </div>\n  </div>\n</section>\n\n<!--
    ── About ─────────────────────────────────────────────────── -->\n<section id=\"about\"
    class=\"animate-in\">\n  <p class=\"section-label\">01 / about</p>\n  <h2 class=\"section-title\">Who
    I Am</h2>\n  <div class=\"section-divider\"></div>\n  <div class=\"card\">\n    <p
    style=\"color:var(--text-muted); line-height:1.8; font-size:15px;\">\n      I'm
    a software developer and DevOps engineer based in <strong style=\"color:var(--text)\">Helsinki,
    Finland</strong>,\n      currently working at <strong style=\"color:var(--text)\">Ericsson</strong>
    where I design CI/CD pipelines,\n      manage Kubernetes clusters, and automate
    infrastructure.\n    </p>\n    <p style=\"color:var(--text-muted); line-height:1.8;
    font-size:15px; margin-top:14px;\">\n      My background spans IoT, blockchain,
    payment systems, and telecom — across five countries and three degrees.\n      Outside
    of work I run a self-hosted <strong style=\"color:var(--accent)\">K3s HA cluster</strong>
    at home\n      with Longhorn storage, MetalLB, Caddy, Authelia, and a full Arr
    media stack — because the best way\n      to learn infrastructure is to break
    it at home first.\n    </p>\n    <div style=\"display:flex; gap:12px; flex-wrap:wrap;
    margin-top:20px;\">\n      <a href=\"https://fi.linkedin.com/in/yusuf-taylan-yuksel\"
    class=\"btn btn-outline\" style=\"padding:8px 16px; font-size:13px;\">LinkedIn
    ↗</a>\n      <a href=\"https://github.com/maestro00\" class=\"btn btn-outline\"
    style=\"padding:8px 16px; font-size:13px;\">GitHub ↗</a>\n      <a href=\"mailto:ytaylanyuksel@gmail.com\"
    class=\"btn btn-outline\" style=\"padding:8px 16px; font-size:13px;\">Email ↗</a>\n
    \   </div>\n  </div>\n</section>\n\n<!-- ── Experience ───────────────────────────────────────────────
    -->\n<section id=\"experience\" class=\"animate-in\">\n  <p class=\"section-label\">02
    / experience</p>\n  <h2 class=\"section-title\">Work History</h2>\n  <div class=\"section-divider\"></div>\n
    \ <div class=\"timeline\">\n\n    <div class=\"tl-item animate-in\">\n      <div
    class=\"tl-dot\"></div>\n      <div class=\"tl-content card\">\n        <div class=\"tl-header\">\n
    \         <div>\n            <h3 class=\"tl-role\">Software Developer</h3>\n            <p
    class=\"tl-company\">Ericsson <span class=\"tl-location\">· Helsinki, Finland</span></p>\n
    \         </div>\n          <span class=\"tl-date\">Oct 2022 — Present</span>\n
    \       </div>\n        <ul class=\"tl-bullets\">\n          <li>Designed and
    managed CI/CD pipelines using Jenkins, Groovy, and Helm</li>\n          <li>Owned
    full lab infrastructure lifecycle: planning, equipment, and setup</li>\n          <li>Managed
    Kubernetes clusters and automated infrastructure as code</li>\n          <li>Collaborated
    on secure, high-performance development environments</li>\n        </ul>\n        <div
    class=\"tl-tags\">\n          <span class=\"tag\">Jenkins</span><span class=\"tag\">Kubernetes</span><span
    class=\"tag\">Helm</span><span class=\"tag\">Groovy</span><span class=\"tag\">IaC</span>\n
    \       </div>\n      </div>\n    </div>\n\n    <div class=\"tl-item animate-in\">\n
    \     <div class=\"tl-dot\"></div>\n      <div class=\"tl-content card\">\n        <div
    class=\"tl-header\">\n          <div>\n            <h3 class=\"tl-role\">Software
    Developer</h3>\n            <p class=\"tl-company\">Templari SRL <span class=\"tl-location\">·
    Italy</span></p>\n          </div>\n          <span class=\"tl-date\">Feb 2021
