    IoT Bridge applications and MQTT-based services</li>\n          <li>Built .NET
    Core MVC web interfaces to visualize client sensor data</li>\n          <li>Handled
    large datasets generated by on-premise IoT devices</li>\n        </ul>\n        <div
    class=\"tl-tags\">\n          <span class=\"tag\">.NET Core</span><span class=\"tag\">MQTT</span><span
    class=\"tag\">IoT</span><span class=\"tag\">C#</span>\n        </div>\n      </div>\n
    \   </div>\n\n    <div class=\"tl-item animate-in\">\n      <div class=\"tl-dot\"></div>\n
