    <script>
    (function () {
      var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.querySelectorAll('main section, .first-screen, footer').forEach(function (parent) {
        Array.prototype.forEach.call(parent.children, function (el, i) {
          el.classList.add('rise');
          el.style.transitionDelay = Math.min(i * 70, 280) + 'ms';
        });
      });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll('.rise').forEach(function (el) { rm ? el.classList.add('in') : io.observe(el); });

      var strip = document.getElementById('strip');
      function light() {
        var rect = strip.getBoundingClientRect();
        var mid = rect.left + rect.width / 2, best = null, bd = 1e9;
        strip.querySelectorAll('figure').forEach(function (f) {
          var r = f.getBoundingClientRect(), d = Math.abs(r.left + r.width / 2 - mid);
          if (d < bd) { bd = d; best = f; }
        });
        strip.querySelectorAll('.lit').forEach(function (f) { f.classList.remove('lit'); });
        if (best) best.classList.add('lit');
      }
      strip.addEventListener('scroll', light, { passive: true });
      strip.addEventListener('wheel', function (e) {
        var max = strip.scrollWidth - strip.clientWidth;
        var canGo = e.deltaY > 0 ? strip.scrollLeft < max - 1 : strip.scrollLeft > 1;
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && canGo) { e.preventDefault(); strip.scrollLeft += e.deltaY * 0.9; }
      }, { passive: false });
      light();
    })();
    </script>
