    \   </div>\n\n    <div class=\"tl-item animate-in\">\n      <div class=\"tl-dot\"
    style=\"background:var(--text-muted);\"></div>\n      <div class=\"tl-content
    card\">\n        <div class=\"tl-header\">\n          <div>\n            <h3 class=\"tl-role\">Engineer
    Trainee</h3>\n            <p class=\"tl-company\">Częstochowa Univ. of Technology
    <span class=\"tl-location\">· Poland</span></p>\n          </div>\n          <span
    class=\"tl-date\">Jul — Aug 2017</span>\n        </div>\n        <ul class=\"tl-bullets\">\n
    \         <li>Researched CUDA GPU performance with image processing algorithms
    in MATLAB</li>\n        </ul>\n        <div class=\"tl-tags\">\n          <span
    class=\"tag\">CUDA</span><span class=\"tag\">MATLAB</span><span class=\"tag\">GPU</span>\n
    \       </div>\n      </div>\n    </div>\n\n  </div>\n</section>\n\n<!-- ── Skills
    ─────────────────────────────────────────────────── -->\n<section id=\"skills\"
    class=\"animate-in\">\n  <p class=\"section-label\">03 / skills</p>\n  <h2 class=\"section-title\">Tech
    Stack</h2>\n  <div class=\"section-divider\"></div>\n  <div class=\"skills-grid\">\n\n
    \   <div class=\"card animate-in\">\n      <div class=\"skill-icon\">⚙️</div>\n
    \     <h4 class=\"skill-cat\">DevOps &amp; Infrastructure</h4>\n      <div class=\"skill-tags\">\n
