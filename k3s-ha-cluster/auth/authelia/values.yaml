# https://github.com/authelia/chartrepo/blob/master/charts/authelia/values.yaml
image:
  repository: authelia/authelia
  tag: latest

service:
  type: ClusterIP
  port: 9091

ingress:
  enabled: false

persistence:
  enabled: true
  existingClaim: authelia-config

secret:
  existingSecret: authelia-secrets
  additionalSecrets:
    jwk-rsa:
      items:
        - key: private.pem
          path: private.pem

configMap:
  theme: dark

  log:
    level: info

  authentication_backend:
    ldap:
      enabled: true
      implementation: lldap
      address: ldap://lldap.auth.svc.cluster.local:3890
      base_dn: dc=yukselcloud,dc=com
      user: uid=lab,ou=people,dc=yukselcloud,dc=com
      users_filter: (&({username_attribute}={input})(objectClass=person))
      groups_filter: (member={dn})
      attributes:
        username: uid
        display_name: displayName
        mail: mail
        group_name: cn

  server:
    endpoints:
      authz:
        auth-request:
          implementation: "AuthRequest"

  session:
    name: authelia_session
    expiration: 1h
    inactivity: 5m
    remember_me: 30d
    same_site: none
    cookies:
      - domain: yukselcloud.com
        authelia_url: https://auth.yukselcloud.com
        secure: true
    redis:
      enabled: true
      host: redis.auth.svc.cluster.local
      port: 6379

  storage:
    local:
      enabled: true
      path: /config/db.sqlite3

  notifier:
    filesystem:
      enabled: true
      filename: /config/notification.txt

  access_control:
    default_policy: deny
    rules:
      - domain: auth.yukselcloud.com
        policy: bypass
        resources:
          - "^/api/.*$"
          - "^/.well-known/.*$"
          - "^/static/.*$"

      - domain: git.yukselcloud.com
        policy: one_factor

      - domain: "*.yukselcloud.com"
        subject:
          - "group:infra"
        policy: one_factor

      - domain:
          - radarr.yukselcloud.com
          - sonarr.yukselcloud.com
          - jellyfin.yukselcloud.com
        policy: one_factor

  identity_providers:
    oidc:
      enabled: true
      cors:
        endpoints:
          - authorization
          - token
          - revocation
          - introspection
          - userinfo
        allowed_origins:
          - https://git.yukselcloud.com
          - https://jellyfin.yukselcloud.com
        allowed_origins_from_client_redirect_uris: true

      claims_policies:
        legacy:
          id_token:
            - email
            - email_verified
            - alt_emails
            - name
            - preferred_username
            - groups

      jwks:
        - key_id: default
          algorithm: RS256
          use: sig
          key:
            path: /secrets/jwk-rsa/private.pem

      clients:
        - client_id: forgejo
          client_name: Forgejo
          client_secret: "$pbkdf2-sha512$310000$xcIipZZRUvCxyF2PQZTfCg$aM96WaO2Gt1Ut7RS.eVnpBJIpihWk9M8eY5kYK5DG6F7ICuF1Z0ijgo5DyEDbOQ1cP9fbY3ovnrv1eo9kPgL8g"
          public: false
          authorization_policy: one_factor
          require_pkce: true
          redirect_uris:
            - https://git.yukselcloud.com/user/oauth2/Authelia/callback
          scopes:
            - openid
            - email
            - profile
            - groups
            - offline_access
          grant_types:
            - authorization_code
            - refresh_token
          response_types:
            - code
          claims_policy: legacy
        - client_id: jellyfin
          client_name: Jellyfin
          client_secret: "$pbkdf2-sha512$310000$bqQbNCRnBPgBqRg8b20Sxg$3ZFPwbQ6RHN8WTx41M1cBnn2Jh5TCtj.buEhuNKjGxRnkzFMX.UT2cLNWsmwnChbBWeXw10wau94O6nY/sPuhw"
          public: false
          authorization_policy: one_factor
          require_pkce: true
          redirect_uris:
            - https://jellyfin.yukselcloud.com/sso/OID/redirect/Authelia
          scopes:
            - openid
            - email
            - profile
            - groups
            - offline_access
          grant_types:
            - authorization_code
            - refresh_token
          response_types:
            - code
          claims_policy: legacy
        - client_id: vaultwarden
          client_name: Vaultwarden
          client_secret: "$pbkdf2-sha512$310000$DLxf0AmuupjG96/k.DAWTA$jGxbYD/nHX/kk/Nj2XXMSCJyO/.a1V6nSaDbylbcbFd.Zh.6ECUfRVYHsSa55YL6GuNu7echBtsUG83aMXfLtg"
          public: false
          authorization_policy: one_factor
          require_pkce: true
          redirect_uris:
            - https://vaultwarden.yukselcloud.com/identity/connect/oidc/signin
          scopes:
            - openid
            - email
            - profile
            - groups
            - offline_access
          grant_types:
            - authorization_code
            - refresh_token
          response_types:
            - code
          claims_policy: legacy
        - client_id: homarr
          client_name: Homarr
          client_secret: "$pbkdf2-sha512$310000$suciIlHCbfAyuSK2Ia6Diw$kxzF8HCygIfFCPk1CIfwNzqxIsp.ZiWvoao3b2yryEQnHe1CODQFRisv.UvxqOA1LLBArp/lapu1LyuT45BJ3Q"
          public: false
          authorization_policy: one_factor
          require_pkce: true
          redirect_uris:
            - https://homarr.yukselcloud.com/api/auth/callback/oidc
          scopes:
            - openid
            - email
            - profile
            - groups
          grant_types:
            - authorization_code
          response_types:
            - code
          claims_policy: legacy
