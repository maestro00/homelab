apiVersion: v1
kind: Secret
metadata:
  name: beszel-agent
  namespace: monitoring
  labels:
    app: beszel
type: Opaque
stringData:
  # Replace with the hub's public key (Settings -> Tokens & Fingerprints / Add System)
  # and the permanent universal token (Settings -> Tokens & Fingerprints).
  # Apply locally with:
  #   kubectl -n monitoring create secret generic beszel-agent \
  #     --from-literal=key="ssh-ed25519 ..." \
  #     --from-literal=token="<universal-token>"
  key: "<beszel-hub-public-key>"
  token: "<permanent-universal-token>"
