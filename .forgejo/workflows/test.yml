name: Test Action
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run a test
        run: echo "Hello from Forgejo Actions!"

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -sf \
            -H "Title: test action: $STATUS" \
            -H "Tags: $([[ "$STATUS" == "success" ]] && echo 'white_check_mark' || echo 'warning')" \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -d "Test workflow ran — $STATUS" \
            https://ntfy.yukselcloud.com/homelab-deploys
