name: Deploy External Secrets
on:
  push:
    paths:
      - "k3s-ha-cluster/external-secrets/**"
  workflow_dispatch:

jobs:
  deploy-external-secrets:
    runs-on: self-hosted

    container:
      image: git.yukselcloud.com/lab/kubectl-node:latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEPLOY }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure Namespaces
        run: |
          kubectl create namespace external-secrets --dry-run=client -o yaml \
            | kubectl apply -f -
          kubectl create namespace argocd --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Helm Upgrade External Secrets
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update external-secrets
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --version 2.14.0 \
            --namespace external-secrets \
            --values k3s-ha-cluster/external-secrets/values.yaml

      - name: Apply Store RBAC
        run: |
          kubectl apply -f k3s-ha-cluster/external-secrets/store-rbac.yaml

      - name: Seed source secret
        run: |
          set -eu
          test -n "${{ secrets.FORGEJO_READ_TOKEN }}" || {
            echo "Missing FORGEJO_READ_TOKEN" >&2
            exit 1
          }
          test -n "${{ secrets.VAULTWARDEN_ADMIN_TOKEN }}" || {
            echo "Missing VAULTWARDEN_ADMIN_TOKEN" >&2
            exit 1
          }
          test -n "${{ secrets.VAULTWARDEN_SSO_CLIENT_SECRET }}" || {
            echo "Missing VAULTWARDEN_SSO_CLIENT_SECRET" >&2
            exit 1
          }
          kubectl -n external-secrets get secret gitops-secrets >/dev/null 2>&1 || \
            kubectl -n external-secrets create secret generic gitops-secrets
          kubectl -n external-secrets patch secret gitops-secrets --type merge \
            --patch "{\"stringData\":{\"forgejo-read-token\":\"${{ secrets.FORGEJO_READ_TOKEN }}\",\"vaultwarden-admin-token\":\"${{ secrets.VAULTWARDEN_ADMIN_TOKEN }}\",\"vaultwarden-sso-client-id\":\"vaultwarden\",\"vaultwarden-sso-client-secret\":\"${{ secrets.VAULTWARDEN_SSO_CLIENT_SECRET }}\"}}"

      - name: Seed auth secrets
        env:
          AUTHELIA_RESET_PASSWORD_JWT_HMAC_KEY: ${{ secrets.AUTHELIA_RESET_PASSWORD_JWT_HMAC_KEY }}
          AUTHELIA_SESSION_ENCRYPTION_KEY: ${{ secrets.AUTHELIA_SESSION_ENCRYPTION_KEY }}
          AUTHELIA_STORAGE_ENCRYPTION_KEY: ${{ secrets.AUTHELIA_STORAGE_ENCRYPTION_KEY }}
          AUTHELIA_LDAP_PASSWORD: ${{ secrets.AUTHELIA_LDAP_PASSWORD }}
          AUTHELIA_OIDC_HMAC_KEY: ${{ secrets.AUTHELIA_OIDC_HMAC_KEY }}
          AUTHELIA_JWK_RSA_PRIVATE_KEY: ${{ secrets.AUTHELIA_JWK_RSA_PRIVATE_KEY }}
          AUTHELIA_OIDC_FORGEJO_CLIENT_SECRET_HASH: ${{ secrets.AUTHELIA_OIDC_FORGEJO_CLIENT_SECRET_HASH }}
          AUTHELIA_OIDC_JELLYFIN_CLIENT_SECRET_HASH: ${{ secrets.AUTHELIA_OIDC_JELLYFIN_CLIENT_SECRET_HASH }}
          AUTHELIA_OIDC_VAULTWARDEN_CLIENT_SECRET_HASH: ${{ secrets.AUTHELIA_OIDC_VAULTWARDEN_CLIENT_SECRET_HASH }}
          LLDAP_JWT_SECRET: ${{ secrets.LLDAP_JWT_SECRET }}
          LLDAP_ADMIN_USERNAME: ${{ secrets.LLDAP_ADMIN_USERNAME }}
          LLDAP_ADMIN_PASSWORD: ${{ secrets.LLDAP_ADMIN_PASSWORD }}
          LLDAP_BASE_DN: ${{ secrets.LLDAP_BASE_DN }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -eu
          for name in \
            AUTHELIA_RESET_PASSWORD_JWT_HMAC_KEY \
            AUTHELIA_SESSION_ENCRYPTION_KEY \
            AUTHELIA_STORAGE_ENCRYPTION_KEY \
            AUTHELIA_LDAP_PASSWORD \
            AUTHELIA_OIDC_HMAC_KEY \
            AUTHELIA_JWK_RSA_PRIVATE_KEY \
            AUTHELIA_OIDC_FORGEJO_CLIENT_SECRET_HASH \
            AUTHELIA_OIDC_JELLYFIN_CLIENT_SECRET_HASH \
            AUTHELIA_OIDC_VAULTWARDEN_CLIENT_SECRET_HASH \
            LLDAP_JWT_SECRET \
            LLDAP_ADMIN_USERNAME \
            LLDAP_ADMIN_PASSWORD \
            LLDAP_BASE_DN \
            REDIS_PASSWORD ; do
            eval "value=\${$name}"
            test -n "$value" || { echo "Missing $name" >&2; exit 1; }
          done
          jq -n \
            --arg reset "$AUTHELIA_RESET_PASSWORD_JWT_HMAC_KEY" \
            --arg session "$AUTHELIA_SESSION_ENCRYPTION_KEY" \
            --arg storage "$AUTHELIA_STORAGE_ENCRYPTION_KEY" \
            --arg ldap "$AUTHELIA_LDAP_PASSWORD" \
            --arg oidc_hmac "$AUTHELIA_OIDC_HMAC_KEY" \
            --arg jwk "$AUTHELIA_JWK_RSA_PRIVATE_KEY" \
            --arg forgejo "$AUTHELIA_OIDC_FORGEJO_CLIENT_SECRET_HASH" \
            --arg jellyfin "$AUTHELIA_OIDC_JELLYFIN_CLIENT_SECRET_HASH" \
            --arg vaultwarden "$AUTHELIA_OIDC_VAULTWARDEN_CLIENT_SECRET_HASH" \
            --arg lldap_jwt "$LLDAP_JWT_SECRET" \
            --arg lldap_user "$LLDAP_ADMIN_USERNAME" \
            --arg lldap_pass "$LLDAP_ADMIN_PASSWORD" \
            --arg lldap_dn "$LLDAP_BASE_DN" \
            --arg redis "$REDIS_PASSWORD" \
            '{stringData:{
              "authelia-reset-password-jwt-hmac-key":$reset,
              "authelia-session-encryption-key":$session,
              "authelia-storage-encryption-key":$storage,
              "authelia-ldap-password":$ldap,
              "authelia-oidc-hmac-key":$oidc_hmac,
              "authelia-jwk-rsa-private-key":$jwk,
              "authelia-oidc-forgejo-client-secret-hash":$forgejo,
              "authelia-oidc-jellyfin-client-secret-hash":$jellyfin,
              "authelia-oidc-vaultwarden-client-secret-hash":$vaultwarden,
              "lldap-jwt-secret":$lldap_jwt,
              "lldap-admin-username":$lldap_user,
              "lldap-admin-password":$lldap_pass,
              "lldap-base-dn":$lldap_dn,
              "redis-password":$redis
            }}' > /tmp/auth-secrets-patch.json
          kubectl -n external-secrets get secret gitops-secrets >/dev/null 2>&1 || \
            kubectl -n external-secrets create secret generic gitops-secrets
          kubectl -n external-secrets patch secret gitops-secrets \
            --type merge --patch-file /tmp/auth-secrets-patch.json
          rm -f /tmp/auth-secrets-patch.json

      - name: Apply ClusterSecretStore
        run: |
          kubectl apply -f k3s-ha-cluster/external-secrets/cluster-secret-store.yaml

      - name: Apply ExternalSecrets
        run: |
          kubectl apply -f k3s-ha-cluster/external-secrets/argocd-repo-credential.yaml
          kubectl apply -f k3s-ha-cluster/external-secrets/homepage-secrets.yaml
          kubectl apply -f k3s-ha-cluster/external-secrets/auth-secrets.yaml

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")
          TAGS=$([[ "$STATUS" == "success" ]] && echo "white_check_mark" || echo "warning")
          curl -sf \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: external-secrets deploy: $STATUS" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "External Secrets Operator helm upgrade — $STATUS" \
            http://ntfy.ntfy.svc.cluster.local/homelab-deploys
