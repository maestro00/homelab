name: Deploy External Secrets
on:
  push:
    paths:
      - "k3s-ha-cluster/external-secrets/**"
  workflow_dispatch:

jobs:
  deploy-external-secrets:
    runs-on: self-hosted

    container:
      image: git.yukselcloud.com/lab/kubectl-node:latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEPLOY }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure Namespaces
        run: |
          kubectl create namespace external-secrets --dry-run=client -o yaml \
            | kubectl apply -f -
          kubectl create namespace argocd --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Helm Upgrade External Secrets
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update external-secrets
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --version 2.14.0 \
            --namespace external-secrets \
            --values k3s-ha-cluster/external-secrets/values.yaml

      - name: Apply Store RBAC
        run: |
          kubectl apply -f k3s-ha-cluster/external-secrets/store-rbac.yaml

      - name: Seed source secret
        run: |
          set -eu
          test -n "${{ secrets.FORGEJO_READ_TOKEN }}" || {
            echo "Missing FORGEJO_READ_TOKEN" >&2
            exit 1
          }
          test -n "${{ secrets.VAULTWARDEN_ADMIN_TOKEN }}" || {
            echo "Missing VAULTWARDEN_ADMIN_TOKEN" >&2
            exit 1
          }
          test -n "${{ secrets.VAULTWARDEN_SSO_CLIENT_SECRET }}" || {
            echo "Missing VAULTWARDEN_SSO_CLIENT_SECRET" >&2
            exit 1
          }
          kubectl -n external-secrets get secret gitops-secrets >/dev/null 2>&1 || \
            kubectl -n external-secrets create secret generic gitops-secrets
          kubectl -n external-secrets patch secret gitops-secrets --type merge \
            --patch "{\"stringData\":{\"forgejo-read-token\":\"${{ secrets.FORGEJO_READ_TOKEN }}\",\"vaultwarden-admin-token\":\"${{ secrets.VAULTWARDEN_ADMIN_TOKEN }}\",\"vaultwarden-sso-client-id\":\"vaultwarden\",\"vaultwarden-sso-client-secret\":\"${{ secrets.VAULTWARDEN_SSO_CLIENT_SECRET }}\"}}"

      - name: Apply ClusterSecretStore
        run: |
          kubectl apply -f k3s-ha-cluster/external-secrets/cluster-secret-store.yaml

      - name: Apply ExternalSecrets
        run: |
          kubectl apply -f k3s-ha-cluster/external-secrets/argocd-repo-credential.yaml
          kubectl apply -f k3s-ha-cluster/external-secrets/homepage-secrets.yaml

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")
          TAGS=$([[ "$STATUS" == "success" ]] && echo "white_check_mark" || echo "warning")
          curl -sf \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: external-secrets deploy: $STATUS" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "External Secrets Operator helm upgrade — $STATUS" \
            http://ntfy.ntfy.svc.cluster.local/homelab-deploys
