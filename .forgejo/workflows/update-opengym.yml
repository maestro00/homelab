# Update openGym. Images come from upstream's public registry (ghcr.io,
# :latest only) and are archived into the local Forgejo registry pinned at the
# released version — so the cluster keeps pulling immutable version tags.
# skopeo does the copy: no daemon, nothing to build, idempotent.
name: Update openGym

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release tag (e.g. v1.3.7). Leave empty for latest."
        required: false
        type: string

jobs:
  update:
    runs-on: self-hosted
    container:
      image: git.yukselcloud.com/lab/kubectl-node:latest  # has jq + skopeo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEPLOY }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Resolve version
        id: version
        run: |
          CURRENT=$(sed -n 's/.*opengym-api:v\([0-9.]*\).*/\1/p' \
            k3s-ha-cluster/opengym/deployment.yaml)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.version }}" ]; then
            LATEST="${{ inputs.version }}"
          else
            LATEST=$(curl -sf \
              "https://api.github.com/repos/DuarteSantos8/openGym/releases/latest" \
              | jq -r '.tag_name' | sed 's/^v//')
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT | Target: $LATEST"

      - name: Skip if already up to date
        if: steps.version.outputs.current == steps.version.outputs.latest
        run: |
          echo "Already running v${{ steps.version.outputs.current }}, nothing to do."
          exit 0

      - name: Archive images
        if: steps.version.outputs.current != steps.version.outputs.latest
        run: |
          TAG="v${{ steps.version.outputs.latest }}"
          REGISTRY="git.yukselcloud.com/lab"
          CREDS="${{ secrets.FORGEJO_REGISTRY_USER }}:${{ secrets.FORGEJO_REGISTRY_PASSWORD }}"

          for IMG in opengym-api opengym-web; do
            if skopeo list-tags docker://${REGISTRY}/${IMG} --creds="${CREDS}" 2>/dev/null \
                | grep -q "\"${TAG}\""; then
              echo "${IMG}:${TAG} already in registry, skipping copy."
            else
              echo "Copying ghcr.io/duartesantos8/${IMG}:latest -> ${TAG}..."
              skopeo copy \
                docker://ghcr.io/duartesantos8/${IMG}:latest \
                docker://${REGISTRY}/${IMG}:${TAG} \
                --dest-creds="${CREDS}"
            fi
          done

      - name: Update deployment.yaml
        if: steps.version.outputs.current != steps.version.outputs.latest
        run: |
          TAG="v${{ steps.version.outputs.latest }}"
          FILE="k3s-ha-cluster/opengym/deployment.yaml"
          sed -i "s/opengym-api:v[0-9.]*/opengym-api:${TAG}/" "$FILE"
          sed -i "s/opengym-web:v[0-9.]*/opengym-web:${TAG}/" "$FILE"
          echo "Updated to $TAG:"
          grep "image:" "$FILE"

      - name: Commit and push
        if: steps.version.outputs.current != steps.version.outputs.latest
        run: |
          TAG="v${{ steps.version.outputs.latest }}"
          git config user.name "forgejo-bot"
          git config user.email "bot@yukselcloud.com"
          git add k3s-ha-cluster/opengym/deployment.yaml
          git commit -m "opengym: update to ${TAG}"
          git push

      - name: Deploy to cluster
        if: steps.version.outputs.current != steps.version.outputs.latest
        run: |
          kubectl -n opengym apply -f k3s-ha-cluster/opengym/
          kubectl -n opengym rollout restart deploy opengym
          kubectl -n opengym rollout status deploy opengym --timeout=120s

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          VERSION="${{ steps.version.outputs.latest }}"
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")
          TAGS=$([[ "$STATUS" == "success" ]] && echo "white_check_mark" || echo "warning")
          curl -sf \
            -H "Title: openGym update: $STATUS" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -d "openGym updated to v${VERSION} — $STATUS" \
            http://ntfy.ntfy.svc.cluster.local/homelab-deploys