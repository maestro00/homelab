name: Deploy changedetection
on:
  push:
    paths:
      - "k3s-ha-cluster/changedetection/**"
  workflow_dispatch:

jobs:
  deploy-changedetection:
    runs-on: self-hosted

    container:
      image: git.yukselcloud.com/lab/kubectl-node:latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEPLOY }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure Namespace
        run: |
          kubectl create namespace changedetection --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Apply Secrets
        run: |
          # Create-if-missing only: real SALTED_PASS lives in the cluster
          # secret, never in git. Re-applying would wipe it on every deploy.
          if ! kubectl -n changedetection get secret changedetection-secret -o name >/dev/null 2>&1; then
            kubectl -n changedetection apply -f k3s-ha-cluster/changedetection/secret.yaml
          fi

      - name: Apply manifests
        run: |
          kubectl apply -f k3s-ha-cluster/changedetection/pvc.yaml \
                        -f k3s-ha-cluster/changedetection/deployment.yaml \
                        -f k3s-ha-cluster/changedetection/service.yaml

      - name: Wait for rollout
        run: |
          kubectl -n changedetection rollout status deploy/changedetection --timeout=120s
          kubectl -n changedetection rollout status deploy/sockpuppetbrowser --timeout=120s

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")
          TAGS=$([[ "$STATUS" == "success" ]] && echo "white_check_mark" || echo "warning")
          curl -sf \
            -H "Title: changedetection deploy: $STATUS" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -d "changedetection applied and rolled out — $STATUS" \
            http://ntfy.ntfy.svc.cluster.local/homelab-deploys
