name: Deploy Argo CD
on:
  push:
    paths:
      - "k3s-ha-cluster/argocd/**"
  workflow_dispatch:

jobs:
  deploy-argocd:
    runs-on: self-hosted

    container:
      image: git.yukselcloud.com/lab/kubectl-node:latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEPLOY }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure Namespace
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Helm Upgrade Argo CD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          helm upgrade --install argocd argo/argo-cd \
            --version 10.11.6 \
            --namespace argocd \
            --values k3s-ha-cluster/argocd/values.yaml

      - name: Apply app-of-apps
        run: |
          kubectl apply -f k3s-ha-cluster/argocd/app-of-apps.yaml

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          PRIORITY=$([[ "$STATUS" == "success" ]] && echo "default" || echo "high")
          TAGS=$([[ "$STATUS" == "success" ]] && echo "white_check_mark" || echo "warning")
          curl -sf \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: argocd deploy: $STATUS" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "Argo CD helm upgrade — $STATUS" \
            http://ntfy.ntfy.svc.cluster.local/homelab-deploys
