# k3s (like vanilla K8s 1.24+) no longer auto-creates a token Secret for
# every ServiceAccount — tokens are short-lived and requested on demand by
# default. opencode needs a stable, long-lived credential to put in a
# kubeconfig, so this requests one the old-fashioned way: a Secret with the
# right type + annotation makes the token controller populate it for you.
apiVersion: v1
kind: Secret
metadata:
  name: opencode-agent-token
  namespace: opencode-agent
  annotations:
    kubernetes.io/service-account.name: opencode-agent
type: kubernetes.io/service-account-token
