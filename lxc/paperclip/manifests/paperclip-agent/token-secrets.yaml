# Long-lived tokens for the kubeconfigs. Same reason as the opencode agent:
# k3s does not auto-create a token Secret per ServiceAccount, and Paperclip
# needs a credential that survives restarts of the container.
apiVersion: v1
kind: Secret
metadata:
  name: ops-token
  namespace: paperclip-agent
  annotations:
    kubernetes.io/service-account.name: ops
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: deploy-token
  namespace: paperclip-agent
  annotations:
    kubernetes.io/service-account.name: deploy
type: kubernetes.io/service-account-token
